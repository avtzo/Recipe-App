<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recipe App</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://kit.fontawesome.com/7ee5f2ba27.js" crossorigin="anonymous"></script>
</head>
<body>
    <div class="menu-screen">
        <div class="menu-screen-layout">
            <h1>Find your Recipe</h1>
            <div class="options">
                <div class="option">
                    <button type="button" id="random-recipes-btn">Random Recipes</button>
                </div>
                <div class="option">
                    <button type="button" id="search-by-ingredient-btn">Recipes by Ingredient</button>
                </div>
                <div class="option">
                    <button type="button" id="saved-recipes-btn">Saved Recipes</button>
                </div>
            </div>
        </div>
    </div>

    <div class="my-ingredients-screen hidden">
        <div class="my-ingredients-screen-layout">
            <div class="my-ingredients-display"></div>
            <div class="ingredients-options">
                <h1>My Ingredients</h1>
                <button type="button" id="edit-ingredients-btn">Edit Ingredients</button>
                <button type="button" class="back-to-menu-btn">Back To Menu</button>
                <button type="button" id="confirm-ingredients-btn">Search Recipes</button>
            </div>
            <div class="add-remove-ingredients-screen hidden">
                <div class="add-remove-ingredients-screen-layout">
                    <h1>Ingredients</h1>
                    <div class="ingredients-container"></div>
                    <button type="button" id="add-remove-ingredients-btn">Confirm</button>
                </div>
            </div>
        </div>
    </div>

    <div class="recipes-screen hidden">
        <div class="recipes-screen-layout">
            <h1>Recipes</h1>
            <div class="recipes-header">
                <button type="button" class="back-to-menu-btn">Back To Menu</button>
            </div>
            <div class="recipes-container"></div>
        </div>
    </div>

    <div class="error-screen hidden">
        <div class="error-screen-layout">
            <h1>Cook's break! We can't reach the kitchen :(</h1>
            <img src="images/error-img.png" alt="Error Image">
            <p>We're having trouble loading your recipes right now.</p>
            <p>Please check your internet connection or try again in a few moments.</p>
            <button type="button" class="back-to-menu-btn">Back To Menu</button>
        </div>
    </div>

    <script src="script.js" type="module" defer></script>
</body>
</html>
